
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - DocuAI</title>

    <link
        rel="stylesheet"
        href="/static/css/login.css"
    >
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <div class="logo-icon">📄</div>
                <h1>DocuAI</h1>
            </div>

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to continue to your document assistant
            </p>

            {% if error %}
                <div class="login-error">
                    {{ error }}
                </div>
            {% endif %}

            <form
                action="/auth/login"
                method="POST"
            >

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

            <div class="signup-link">

                <span>
                    Don't have an account?
                </span>

                <a href="/signup">
                    Create Account
                </a>

            </div>

            <div class="back-home">
                <a href="/">
                    ← Back to Home
                </a>
            </div>

        </div>

    </div>

</body>
</html>
