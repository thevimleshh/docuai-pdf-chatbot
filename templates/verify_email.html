<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email - DocuAI</title>

    <link rel="stylesheet" href="/static/css/verify_email.css">
</head>

<body>

    <div class="verify-page">

        <div class="verify-card">

            <div class="logo">
                <div class="logo-icon">D</div>
                <span>DocuAI</span>
            </div>

            <div class="icon-circle">
                ✉
            </div>

            <h1>Verify your email</h1>

            <p class="description">
                We have sent a 6-digit verification code
                to your email address.
            </p>

            <form action="/verify-email" method="POST">

                <input
                    type="hidden"
                    name="email"
                    value="{{ email }}"
                >

                <label for="verification_code">
                    Verification Code
                </label>

                <input
                    type="text"
                    id="verification_code"
                    name="verification_code"
                    placeholder="Enter 6-digit code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    required
                >

                <button type="submit">
                    Verify Email
                </button>

            </form>

            {% if message %}
                <p class="message">
                    {{ message }}
                </p>
            {% endif %}

            <p class="help-text">
                Check your inbox and spam folder.
            </p>

            <a href="/signup" class="back-link">
                ← Back to Signup
            </a>

        </div>

    </div>

</body>
</html>
